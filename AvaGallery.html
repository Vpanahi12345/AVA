:root{
  --bg:#0b0e1a; --bg2:#10142a; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.08);
  --bd:rgba(255,255,255,.10); --bd2:rgba(255,255,255,.18);
  --tx:#eef1ff; --mut:#97a0c3; --mut2:#6b7499;
  --gold:#f0b429; --gold2:#ffd479; --goldD:#8a6100;
  --teal:#2dd4bf; --violet:#8b5cf6; --rose:#fb7185; --green:#34d399; --blue:#60a5fa; --orange:#fb923c;
  --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);direction:rtl;overflow:hidden;font-size:14px}
button{font-family:inherit}
::selection{background:rgba(240,180,41,.35)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3352;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.w100{width:100%}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.gap{gap:8px}.gap6{gap:6px}.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:700}
.goldTx{color:var(--gold2)}.greenTx{color:var(--green)}.redTx{color:var(--rose)}.tealTx{color:var(--teal)}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mb8{margin-bottom:8px}
.num{font-variant-numeric:tabular-nums}

/* ===== LOGIN ===== */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;overflow:hidden;
  background:linear-gradient(135deg,#141034,#0b0e1a 45%,#07222e);background-size:220% 220%;animation:bgMove 16s ease infinite}
@keyframes bgMove{0%{background-position:0% 20%}50%{background-position:100% 80%}100%{background-position:0% 20%}}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none}
.b1{width:420px;height:420px;background:#f0b42933;top:-90px;right:-60px;animation:float1 13s ease-in-out infinite alternate}
.b2{width:360px;height:360px;background:#8b5cf640;bottom:-70px;left:-40px;animation:float2 17s ease-in-out infinite alternate}
.b3{width:300px;height:300px;background:#2dd4bf30;top:52%;left:34%;animation:float1 21s ease-in-out infinite alternate-reverse}
@keyframes float1{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,40px) scale(1.15)}}
@keyframes float2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(60px,-45px) scale(.9)}}
.loginCard{position:relative;z-index:2;width:min(400px,92vw);background:rgba(17,21,40,.78);border:1px solid var(--bd2);
  border-radius:22px;padding:34px 30px 26px;box-shadow:var(--sh),0 0 0 1px rgba(240,180,41,.08) inset;backdrop-filter:blur(14px);
  animation:cardIn .7s cubic-bezier(.2,.9,.25,1.2) both;text-align:center}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
.logoBig{font-size:46px;filter:drop-shadow(0 6px 18px rgba(240,180,41,.45));animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09) rotate(-4deg)}}
.loginCard h1{font-size:23px;margin-top:8px;background:linear-gradient(90deg,var(--gold2),#fff,var(--gold2));background-size:200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.loginCard .sub{color:var(--mut);font-size:12.5px;margin:6px 0 20px}
.lfield{position:relative;margin-bottom:13px;text-align:right}
.lfield>span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.8}
.lfield .inp{padding-right:38px}
.lerr{color:var(--rose);font-size:12.5px;min-height:18px;margin-top:6px}
.lhint{color:var(--mut);font-size:11.5px;margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px;line-height:1.9}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ===== INPUTS / BUTTONS ===== */
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--tx);border-radius:10px;
  padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s,background .2s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.15);background:rgba(255,255,255,.09)}
.inp::placeholder{color:var(--mut2)}
select.inp{cursor:pointer}
select.inp option{background:#141a30;color:var(--tx)}
textarea.inp{resize:vertical;min-height:64px}
input[type=number].inp{-moz-appearance:textfield}
.inp[readonly]{cursor:pointer}
/* ===== searchable combobox ===== */
.sbox{position:relative}
.sbox .inp{padding-left:26px}
.sbox:after{content:'▾';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;font-size:12px}
.sbox.dis:after{opacity:.4}
.slist{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#141931;border:1px solid var(--bd2);border-radius:12px;
  z-index:80;max-height:232px;overflow-y:auto;box-shadow:var(--sh);animation:fadeUp .16s ease both}
.slist.hide{display:none}
.sitem{padding:8px 13px;font-size:13px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.045);transition:background .12s}
.sitem:hover,.sitem.on{background:rgba(240,180,41,.16)}
.sitem.sel{color:var(--gold)}
.sitem:last-child{border-bottom:none}
.snone{padding:11px 13px;color:var(--mut);font-size:12.5px}
.ssub{color:var(--mut2);font-size:11.5px}
/* ===== search result count ===== */
.resInfo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 2px 10px}
.resInfo .badge{font-size:12.5px;padding:6px 13px}
.resInfo .qTx{background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.4);color:#7ce9dc;border-radius:12px;padding:6px 13px;font-size:12.5px;font-weight:700}
@keyframes fadeUp{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--bd2);color:var(--tx);
  background:rgba(255,255,255,.07);border-radius:10px;padding:9px 16px;font-size:13.5px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s,background .18s,border-color .18s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d99a12);border-color:#ffdf9a;color:#241a00;font-weight:700}
.btn.gold:hover{box-shadow:0 10px 24px rgba(240,180,41,.35)}
.btn.gold::after{content:"";position:absolute;top:0;height:100%;width:60px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  right:-70px;animation:shine 3.2s ease infinite}
@keyframes shine{0%{right:-70px}45%,100%{right:130%}}
.btn.danger{background:linear-gradient(135deg,#f43f5e,#be123c);border-color:#fda4af;color:#fff;font-weight:700}
.btn.green{background:linear-gradient(135deg,#10b981,#047857);border-color:#6ee7b7;color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.icnBtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);
  font-size:17px;cursor:pointer;transition:all .2s;flex:none}
.icnBtn:hover{background:rgba(240,180,41,.15);border-color:var(--gold)}
.hide{display:none}

/* ===== APP LAYOUT ===== */
#app{display:flex;height:100vh}
#side{width:242px;flex:none;background:linear-gradient(180deg,rgba(19,24,48,.97),rgba(12,15,31,.97));
  border-left:1px solid var(--bd);display:flex;flex-direction:column;z-index:20;backdrop-filter:blur(10px)}
.slogo{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid var(--bd)}
.slogoIc{font-size:30px;filter:drop-shadow(0 4px 12px rgba(240,180,41,.4));animation:logoPulse 4s ease-in-out infinite}
.slogo b{font-size:15.5px;display:block}
.slogo small{color:var(--mut);font-size:11px}
#nav{flex:1;overflow-y:auto;padding:10px 8px}
.navSec{color:var(--mut2);font-size:10.5px;margin:12px 8px 5px;letter-spacing:.5px}
.navItem{display:flex;align-items:center;gap:10px;padding:9.5px 11px;border-radius:11px;cursor:pointer;color:#c6cdea;
  font-size:13.5px;margin-bottom:3px;border:1px solid transparent;transition:all .22s;position:relative}
.navItem .ni{font-size:16.5px;width:22px;text-align:center;transition:transform .25s}
.navItem:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(-4px)}
.navItem:hover .ni{transform:scale(1.2) rotate(-6deg)}
.navItem.on{background:linear-gradient(90deg,rgba(240,180,41,.18),rgba(240,180,41,.05));border-color:rgba(240,180,41,.35);color:var(--gold2);font-weight:700}
.navItem.on::before{content:"";position:absolute;right:-8px;top:20%;height:60%;width:4px;border-radius:4px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:rgba(13,17,34,.85);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);z-index:15}
.pgTitle{font-size:16.5px;font-weight:800;white-space:nowrap}
.topStats{display:flex;gap:8px;margin-right:8px;overflow:hidden}
.tStat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.055);border:1px solid var(--bd);
  padding:5px 11px;border-radius:20px;font-size:12px;white-space:nowrap;color:#cdd5f5}
.tStat b{color:var(--gold2)}
.tSpacer{flex:1}
.userBox{position:relative}
.userChip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--bd);
  padding:6px 12px;border-radius:22px;cursor:pointer;transition:all .2s}
.userChip:hover{border-color:var(--gold)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));display:flex;
  align-items:center;justify-content:center;font-size:13px;flex:none}
.udrop{position:absolute;top:46px;left:0;width:210px;background:#151a30;border:1px solid var(--bd2);border-radius:13px;
  box-shadow:var(--sh);padding:7px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all .22s;z-index:40}
.udrop.on{opacity:1;pointer-events:auto;transform:none}
.udrop button{display:flex;align-items:center;gap:9px;width:100%;text-align:right;background:none;border:none;color:var(--tx);
  padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer}
.udrop button:hover{background:rgba(255,255,255,.08)}
#pageWrap{flex:1;overflow:auto;padding:18px 20px 40px;scroll-behavior:smooth}
/* v4.0: در پنجرهٔ تمام‌صفحه هم صفحه تا حدی باز می‌شود (بدون کشیدگی، وسط‌چین) */
#page{max-width:1600px;margin:0 auto;animation:pageIn .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== CARDS / STATS ===== */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.card.pad0{padding:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.statCard{border-radius:var(--r);padding:15px 16px;border:1px solid var(--bd);background:var(--card);position:relative;overflow:hidden;
  animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both;transition:transform .2s,box-shadow .2s}
.statCard:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.statCard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--ac,var(--gold))}
.statCard .scIc{font-size:23px;float:left;opacity:.92}
.statCard .scV{font-size:21px;font-weight:800;margin-top:4px;color:var(--tx)}
.statCard .scT{color:var(--mut);font-size:12px;margin-top:3px}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.statsStrip{position:sticky;top:-18px;z-index:8;display:flex;gap:10px;margin:-4px 0 14px;padding:10px 12px;flex-wrap:wrap;
  background:rgba(13,17,34,.92);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:14px}
.wStat{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--bd);
  border-radius:11px;padding:8px 13px}
.wStat .wi{font-size:21px}
.wStat .wv{font-size:15.5px;font-weight:800;color:var(--gold2)}
.wStat .wt{font-size:11px;color:var(--mut)}

/* ===== TABLES ===== */
.twrap{overflow:auto;max-height:62vh;border-radius:12px;border:1px solid var(--bd)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl thead th{position:sticky;top:0;background:#171d38;color:#dfe5ff;font-weight:700;padding:10px 9px;text-align:center;
  border-bottom:1px solid var(--bd2);z-index:2;white-space:nowrap}
.tbl td{padding:8.5px 9px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
.tbl tbody tr{animation:rowIn .35s both;transition:background .15s}
.tbl tbody tr:nth-child(1){animation-delay:.02s}.tbl tbody tr:nth-child(2){animation-delay:.05s}.tbl tbody tr:nth-child(3){animation-delay:.08s}
.tbl tbody tr:nth-child(4){animation-delay:.11s}.tbl tbody tr:nth-child(5){animation-delay:.14s}.tbl tbody tr:nth-child(6){animation-delay:.17s}
@keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.tbl tbody tr:hover{background:rgba(240,180,41,.06)}
.tbl .act button{margin:0 2px}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;border:1px solid var(--bd2);background:#1a2040}
.thumb.big{width:74px;height:74px;border-radius:13px}
.photoPrint{width:100px;height:120px;object-fit:cover;border-radius:10px;border:3px solid #b8860b;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.empty{padding:38px 20px;text-align:center;color:var(--mut)}
.empty .ei{font-size:42px;display:block;margin-bottom:10px;animation:float2 5s ease-in-out infinite alternate}

/* ===== TABS / BADGES / MISC ===== */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 15px;border-radius:20px;border:1px solid var(--bd);background:rgba(255,255,255,.045);cursor:pointer;
  font-size:13px;color:#c2c9ea;transition:all .22s}
.tab:hover{border-color:var(--gold);color:#fff}
.tab.on{background:linear-gradient(135deg,var(--gold),#d99a12);color:#241a00;font-weight:700;border-color:#ffdf9a;box-shadow:0 5px 15px rgba(240,180,41,.25)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700}
.bg-gold{background:rgba(240,180,41,.16);color:var(--gold2)}.bg-green{background:rgba(52,211,153,.15);color:var(--green)}
.bg-red{background:rgba(251,113,133,.15);color:var(--rose)}.bg-blue{background:rgba(96,165,250,.15);color:var(--blue)}
.bg-violet{background:rgba(139,92,246,.18);color:#c4b5fd}.bg-gray{background:rgba(255,255,255,.09);color:var(--mut)}
.frow{margin-bottom:11px}
.frow>label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.frow>label .req{color:var(--rose)}
.fhint{font-size:11px;color:var(--mut2);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.photoInp{display:flex;align-items:center;gap:12px}
.permGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.permItem{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.045);border:1px solid var(--bd);
  border-radius:10px;padding:9px 11px;cursor:pointer;transition:all .2s;font-size:13px}
.permItem:hover{border-color:var(--gold)}
.permItem input{accent-color:var(--gold);width:16px;height:16px;cursor:pointer}
.chkRow{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px;cursor:pointer}
.chkRow input{accent-color:var(--gold);width:15px;height:15px}

/* ===== MODAL / TOAST / CAL =====
   v6.7.1 (رفع اشکال «پنجرهٔ تأیید در پیشخوان مدیریت دیده نمی‌شود و دکمه‌هایش کار نمی‌کند»):
   پیشخوان مدیریت z-index:70 دارد و پنجرهٔ مودال (z-index قدیمی: 60) زیرِ آن رندر
   می‌شد — پنجرهٔ تأیید نامرئی بود و کلیک‌ها به پیشخوان می‌رسیدند نه به دکمه‌ها.
   حالا ترتیب لایه‌ها: مودال ۲۰۰ > پیشخوان ۷۰ > بقیهٔ عناصر شناور، و توست ۲۱۰ و
   تقویم ۲۳۰ همیشه بالای مودال می‌مانند (تقویمِ فیلدهای تاریخِ داخل مودال). */
.ov{position:fixed;inset:0;background:rgba(5,8,18,.66);backdrop-filter:blur(5px);z-index:200;display:flex;
  align-items:center;justify-content:center;opacity:0;transition:opacity .2s;padding:18px;
  pointer-events:none}
.ov.on{opacity:1;pointer-events:auto}
.modal{width:min(480px,94vw);max-height:92vh;display:flex;flex-direction:column;background:#141931;border:1px solid var(--bd2);
  border-radius:18px;box-shadow:var(--sh);animation:mIn .32s cubic-bezier(.2,.9,.3,1.25) both;overflow:hidden}
.modal.wide{width:min(720px,95vw)}
.modal.xwide{width:min(960px,96vw)}
/* v6.8.7 — تمام‌صفحه شدن پنجرهٔ رکوردها (دکمهٔ ⛶ در سرصفحهٔ پنجره) */
.ov.full{padding:0}
.modal.full{width:100vw;height:100vh;max-height:100vh;border-radius:0;animation:none}
.modal.full .mbody{flex:1;min-height:0}
.mx.fmx:hover{transform:none}
.mx.fmx.on{color:var(--gold);background:rgba(212,175,55,.14)}
@keyframes mIn{from{opacity:0;transform:translateY(26px) scale(.93)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:800;font-size:15px}
.mx{background:none;border:none;color:var(--mut);font-size:17px;cursor:pointer;transition:all .2s;padding:4px 8px;border-radius:8px}
.mx:hover{color:var(--rose);background:rgba(251,113,133,.12);transform:rotate(90deg)}
.mbody{padding:16px 18px;overflow-y:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-start;gap:9px}
.cmsg{line-height:2;font-size:13.5px}
#toastRoot{position:fixed;bottom:22px;left:22px;z-index:210;display:flex;flex-direction:column;gap:9px}
.toast{display:flex;align-items:center;gap:9px;background:#161c36;border:1px solid var(--bd2);border-radius:12px;padding:11px 16px;
  font-size:13px;box-shadow:var(--sh);animation:tIn .35s cubic-bezier(.2,.9,.3,1.3) both;max-width:340px}
.toast.ok{border-color:rgba(52,211,153,.5)}.toast.err{border-color:rgba(251,113,133,.55)}
.toast.out{animation:tOut .3s both}
@keyframes tIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(-30px) scale(.92)}}
#calRoot .cal{position:fixed;z-index:230;width:272px;background:#161b34;border:1px solid var(--bd2);border-radius:16px;
  box-shadow:var(--sh);padding:12px;animation:calIn .25s cubic-bezier(.2,.9,.3,1.3) both;user-select:none}
@keyframes calIn{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calHead .cm{font-weight:800;font-size:13.5px;color:var(--gold2)}
.calNav{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);cursor:pointer;font-size:13px}
.calNav:hover{border-color:var(--gold)}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.calWd{font-size:10.5px;color:var(--mut2);padding:4px 0}
.calD{padding:6px 0;border-radius:8px;font-size:12.5px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.calD:hover{background:rgba(240,180,41,.15);border-color:rgba(240,180,41,.4)}
.calD:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(240,180,41,.45);background:rgba(240,180,41,.12)}
.calD.off{color:var(--mut2);opacity:.4}
.calD.today{border-color:var(--teal);color:var(--teal)}
.calD.sel{background:linear-gradient(135deg,var(--gold),#d99a12);color:#241a00;font-weight:800}
.calFoot{display:flex;justify-content:space-between;margin-top:9px;border-top:1px dashed var(--bd);padding-top:9px}
.calRangeHint{font-size:11px;color:var(--teal);text-align:center;margin-top:7px;min-height:14px}

/* ===== CHARTS =====
   v4.0: نمودارها با aspect-ratio ثابت‌اند و عرض واقعی ظرف را می‌گیرند؛
   موتور ترسیم هنگام تغییر اندازه دوباره ترسیم می‌کند، پس دایره هرگز بیضی نمی‌شود */
.chartCard canvas{width:100%;height:265px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:9px 15px;margin-top:11px;font-size:12px;color:#c6cdea}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
.qaBtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:13px;border:1px solid var(--bd);
  background:rgba(255,255,255,.045);cursor:pointer;color:var(--tx);font-size:12.5px;transition:all .22s;text-align:center}
.qaBtn:hover{transform:translateY(-4px);border-color:var(--gold);background:rgba(240,180,41,.09)}
.qaBtn .qi{font-size:25px}
.activityItem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(255,255,255,.07);font-size:12.5px}
.activityItem:last-child{border:none}

/* ===== RESPONSIVE / MOTION ===== */
#scrim{display:none}
#menuBtn{display:none}
@media (max-width:1050px){
  .grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}
  .topStats .tStat:nth-child(n+3){display:none}
}
@media (max-width:860px){
  #menuBtn{display:inline-flex}
  #side{position:fixed;inset:0 0 0 auto;width:250px;transform:translateX(100%);transition:transform .28s}
  #side.open{transform:none;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
  #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .25s}
  #scrim.on{opacity:1;pointer-events:auto}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .topStats{display:none}
  #pageWrap{padding:13px 12px 40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ===== حالت روز (تم روشن) ===== */
html.day{
  --bg:#eef1f7; --bg2:#ffffff; --card:#ffffff; --card2:#f4f6fb;
  --bd:#e0e6f0; --bd2:#c9d4e5;
  --tx:#1e2740; --mut:#5a6580; --mut2:#8b94ac;
  --sh:0 10px 30px rgba(30,41,72,.13);
}
:where(html.day) body{background:
  radial-gradient(900px 520px at 88% -10%, rgba(240,180,41,.16), transparent 62%),
  radial-gradient(820px 540px at -8% 108%, rgba(45,212,191,.16), transparent 62%),
  radial-gradient(600px 420px at 8% 6%, rgba(139,92,246,.08), transparent 60%),
  linear-gradient(165deg,#f9fafe,#eef1f7 55%,#e9eff5);
  background-attachment:fixed}
:where(html.day) ::selection{background:rgba(240,180,41,.30)}
:where(html.day) ::-webkit-scrollbar-thumb{background:#c2cbdd}
/* --- ورود --- */
:where(html.day) #loginScreen{background:linear-gradient(135deg,#fdf6e7,#eef1f7 48%,#e3f1ef)}
:where(html.day) .blob{opacity:.5}
:where(html.day) .b1{background:#f0b42955}
:where(html.day) .b2{background:#8b5cf633}
:where(html.day) .b3{background:#2dd4bf40}
:where(html.day) .loginCard{background:rgba(255,255,255,.87);
  box-shadow:0 24px 60px rgba(30,41,72,.18),0 0 0 1px rgba(240,180,41,.22) inset}
:where(html.day) .loginCard h1{background:linear-gradient(90deg,var(--gold),#7a5800,var(--gold));background-size:200%;
  -webkit-background-clip:text;background-clip:text}
/* --- ورودی‌ها و دکمه‌ها --- */
:where(html.day) .inp{background:#fff;border-color:var(--bd)}
:where(html.day) .inp:focus{background:#fff;box-shadow:0 0 0 3px rgba(240,180,41,.18)}
:where(html.day) select.inp option{background:#fff;color:var(--tx)}
:where(html.day) .btn{background:#fff;border-color:var(--bd2);box-shadow:0 1px 3px rgba(30,41,72,.09)}
:where(html.day) .btn:hover{background:#f6f8fd;box-shadow:0 8px 18px rgba(30,41,72,.15)}
:where(html.day) .btn.ghost{background:transparent;box-shadow:none}
:where(html.day) .btn.ghost:hover{background:rgba(30,41,72,.05)}
:where(html.day) .icnBtn{background:#fff}
/* --- چیدمان --- */
:where(html.day) #side{background:linear-gradient(180deg,#ffffff,#f5f7fc)}
:where(html.day) .navItem{color:#39435e}
:where(html.day) .navItem:hover{background:rgba(30,41,72,.06);color:#101a33}
:where(html.day) .navItem.on{background:linear-gradient(90deg,rgba(240,180,41,.17),rgba(240,180,41,.04));
  border-color:rgba(240,180,41,.5);color:#8a6100}
:where(html.day) #top{background:rgba(255,255,255,.86)}
:where(html.day) .tStat{background:#fff;border-color:var(--bd);color:#39435e}
:where(html.day) .statsStrip{background:rgba(255,255,255,.92)}
:where(html.day) .wStat{background:#fff}
:where(html.day) .userChip{background:#fff}
/* --- کارت‌ها، جدول‌ها و ابزارک‌ها --- */
:where(html.day) .card{box-shadow:0 4px 16px rgba(30,41,72,.07)}
:where(html.day) .tbl thead th{background:#eef2f9;color:#33405f}
:where(html.day) .tbl td{border-bottom:1px solid #edf0f7}
:where(html.day) .tbl tbody tr:hover{background:rgba(240,180,41,.09)}
:where(html.day) .thumb{background:#eef1f7}
:where(html.day) .tab{background:#fff;color:#39435e}
:where(html.day) .tab:hover{color:#101a33}
:where(html.day) .slist{background:#fff}
:where(html.day) .sitem{border-bottom:1px solid #f0f2f8}
:where(html.day) .resInfo .qTx{background:rgba(13,148,136,.10);border-color:rgba(13,148,136,.4);color:#0f766e}
:where(html.day) .udrop{background:#fff}
:where(html.day) .udrop button:hover{background:#f2f5fb}
:where(html.day) .modal{background:#fff}
:where(html.day) .toast{background:#fff}
:where(html.day) .ov{background:rgba(30,41,72,.42)}
/* v6.7.0 — رفع اشکال «تاریخ در حالت روز شب می‌ماند و روزهای تقویم خوانده نمی‌شوند»:
   قانون شب با انتخابگر ID (#calRoot .cal) نوشته شده و از :where(html.day) قوی‌تر است؛
   پس استایلِ روزِ تقویم اعمال نمی‌شد. حالا با همان اولویتِ بالاتر بازنویسی شد. */
html.day #calRoot .cal{background:#ffffff;border-color:#dfe4f2;box-shadow:0 18px 44px rgba(60,60,90,.25)}
html.day #calRoot .calHead .cm{color:#8a6100}
html.day #calRoot .calNav{background:#f2f4fa;border-color:#dfe4f2;color:#1e2740}
html.day #calRoot .calNav:hover{border-color:#e2c26a;background:#fff3d6}
html.day #calRoot .calWd{color:#8b94ac}
html.day #calRoot .calD{color:#1e2740}
html.day #calRoot .calD:hover{background:#fff3d6;border-color:#e2c26a}
html.day #calRoot .calD:focus{outline:none;border-color:#e2c26a;box-shadow:0 0 0 2px rgba(226,194,106,.5);background:#fff3d6}
html.day #calRoot .calD.today{border-color:#0c7d6e;color:#0c7d6e}
html.day #calRoot .calD.sel{background:linear-gradient(135deg,#f0b429,#d99a12);color:#241a00;font-weight:800}
html.day #calRoot .calD.off{color:#8b94ac;opacity:.4}
html.day #calRoot .calFoot{border-top-color:#e8ecf4}
html.day #calRoot .calFoot .btn.ghost{background:#f2f4fa;border-color:#dfe4f2;color:#1e2740}
html.day #calRoot .calRangeHint{color:#0c7d6e}
:where(html.day) .permItem{background:#fff}
:where(html.day) .qaBtn{background:#fff}
:where(html.day) .activityItem{border-bottom:1px dashed #e8ecf4}
:where(html.day) .legend{color:#39435e}
:where(html.day) .swatch.on{border-color:var(--tx);box-shadow:0 0 0 3px rgba(30,41,72,.18)}
/* --- پیشخوان مدیریت --- */
:where(html.day) .aNavItem:hover{background:rgba(30,41,72,.06);color:var(--tx)}
:where(html.day) .icoPick button{background:#fff}
:where(html.day) .menuRow{background:#fff}
:where(html.day) .bg-violet{color:#6d28d9}
/* --- کارت‌های انتخاب حالت --- */
.modeCards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modeCard{position:relative;border:2px solid var(--bd);border-radius:14px;padding:16px 14px;cursor:pointer;
  text-align:center;transition:all .2s;background:var(--card2)}
.modeCard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 18px rgba(30,41,72,.12)}
.modeCard.on{border-color:var(--gold);box-shadow:0 8px 22px rgba(240,180,41,.28)}
.modeCard .mi{font-size:31px;display:block;margin-bottom:7px}
.modeCard .mt{font-weight:800;font-size:14px}
.modeCard .ms{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.8}
.modeCard .mtick{position:absolute;top:9px;left:10px;width:22px;height:22px;border-radius:50%;
  background:var(--gold);color:#241a00;font-size:12px;font-weight:800;display:flex;align-items:center;
  justify-content:center;opacity:0;transform:scale(.4);transition:all .2s}
.modeCard.on .mtick{opacity:1;transform:scale(1)}
@media (max-width:640px){.modeCards{grid-template-columns:1fr}}

/* ===== v3.0 — پنجره‌های تب‌دار ===== */
#tabBar{display:flex;gap:7px;padding:9px 18px 0;overflow-x:auto;flex:none;scrollbar-width:thin}
#tabBar:empty{display:none}
.pgTab{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--bd);border-bottom:none;
  border-radius:11px 11px 0 0;background:var(--card);cursor:pointer;font-size:12.5px;white-space:nowrap;color:var(--mut);
  transition:all .18s;flex:none;user-select:none}
.pgTab:hover{color:var(--tx);background:var(--card2)}
.pgTab.on{background:linear-gradient(180deg,rgba(240,180,41,.17),rgba(240,180,41,.05));color:var(--gold2);
  border-color:rgba(240,180,41,.45);font-weight:700;box-shadow:inset 0 2px 0 var(--gold)}
.pgTab .ti{font-size:14px}
.pgTab .tx{width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;opacity:.55;transition:all .15s}
.pgTab .tx:hover{background:rgba(251,113,133,.22);color:var(--rose);opacity:1;transform:rotate(90deg)}
.pagePane{display:none}
.pagePane.on{display:block;animation:pageIn .45s cubic-bezier(.2,.8,.3,1) both}
/* ===== v3.0 — انتخابگر جستجو: ضربدر پاک‌کردن + شمارش نتایج ===== */
.sbox .inp{padding-left:44px}
.sbox .sclear{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:6px;
  border:none;background:rgba(255,255,255,.09);color:var(--mut);cursor:pointer;font-size:11px;display:none;
  align-items:center;justify-content:center;z-index:2;padding:0;line-height:1}
.sbox .sclear:hover{background:rgba(251,113,133,.22);color:var(--rose)}
.sbox.hasVal .sclear{display:flex}
.sbox.hasVal:after{display:none}
.slist .scount{position:sticky;top:0;z-index:2;padding:6px 13px;font-size:11.5px;font-weight:700;color:var(--mut);
  background:#141931;border-bottom:1px solid var(--bd)}
/* ===== v3.0 — مبلغ به حروف زیر باکس ===== */
.moneyWords{font-size:11.5px;color:var(--teal);font-weight:700;margin-top:4px;min-height:15px;line-height:1.7}
/* ===== v3.0 — تاریخچهٔ گزارش‌ها ===== */
.rhItem{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;
  margin-bottom:8px;background:var(--card2);flex-wrap:wrap}
.rhItem .rht{font-weight:700;font-size:13px}
.rhItem .rhp{font-size:11.5px;color:var(--mut);margin-top:2px}
.rhItem .rhAt{font-size:11px;color:var(--mut2);margin-top:2px}
/* ===== v3.0 — لوگوی عکس‌دار برنامه ===== */
#app{position:relative;z-index:1}
#logoWatermark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  z-index:0;opacity:.065}
#logoWatermark img{max-width:46vmin;max-height:46vmin;object-fit:contain}
.topLogo{height:34px;max-width:110px;object-fit:contain;flex:none}
/* درخواست: لوگوی کوچک پایین صفحهٔ اصلی با ابعاد ۳۰۰×۳۰۰ پیکسل */
#logoFoot{position:fixed;bottom:12px;left:14px;z-index:16;pointer-events:none;opacity:.65}
#logoFoot img{width:300px;height:300px;object-fit:contain}
/* ===== v3.1 — فهرست تیک‌دار انتخاب گروهی (تعرفه‌های مصوب / ثبت تغییرات قیمت) ===== */
.chkList{border:1px solid var(--bd2);border-radius:12px;background:var(--bg2);max-height:285px;overflow:auto;margin-top:8px}
.chkItem{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13px}
.chkItem:last-child{border-bottom:none}
.chkItem:hover{background:rgba(240,180,41,.08)}
.chkItem input[type=checkbox]{width:17px;height:17px;accent-color:var(--gold);flex:none;cursor:pointer}
.chkItem .clSub{margin-right:auto;color:var(--mut);font-size:11.5px}
.chkItem.on{background:rgba(240,180,41,.1)}

/* ===== v4.0 — کمبوباکس تیک‌دار (تعرفه‌های مصوب / ثبت تغییرات قیمت) =====
   لیست تیک‌خورده‌ها دیگر بیرونِ فرم نیست؛ داخل کمبوباکسِ جمع‌شونده است */
.ccomo .inp{padding-left:44px}
.ccomo.hasVal .inp{padding-left:200px}
.ccomo .ccount{position:absolute;left:36px;top:50%;transform:translateY(-50%);
  background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.45);color:var(--teal);
  font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;pointer-events:none;z-index:2}
.ccomo .sclear{left:10px}
.cci{display:flex;align-items:center;gap:9px}
.cci input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);flex:none;cursor:pointer;pointer-events:none}
.cci .ccl{flex:1;min-width:0}
.cci.sel{background:rgba(240,180,41,.12)}
::where(html.day) .ccomo .ccount{background:#e7faf6;border-color:#99e6da;color:#0c7d6e}
::where(html.day) .cci.sel{background:#fff6dd}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* ===== v3.0 — حالت روز برای بخش‌های جدید ===== */
:where(html.day) .pgTab{background:#fff;color:#5a6580}
:where(html.day) .pgTab.on{color:#8a6100;background:linear-gradient(180deg,rgba(240,180,41,.15),rgba(240,180,41,.04))}
:where(html.day) .pgTab .tx:hover{background:rgba(225,29,72,.12)}
:where(html.day) .sbox .sclear{background:#eef1f7}
:where(html.day) .slist .scount{background:#fff;color:#5a6580}
:where(html.day) .moneyWords{color:#0f766e}
:where(html.day) #logoWatermark{opacity:.075}

/* ================= v6.0 ================= */

/* ===== ساعت و تاریخ شمسی زنده — وسط نوار بالا ===== */
#top{position:relative}
.clockBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:11px;
  background:linear-gradient(135deg,rgba(240,180,41,.16),rgba(45,212,191,.10));border:1px solid rgba(240,180,41,.4);
  border-radius:999px;padding:5px 17px;white-space:nowrap;pointer-events:none;z-index:6;
  box-shadow:0 4px 16px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.06) inset,0 0 22px rgba(240,180,41,.12)}
.clkDate{font-size:12px;font-weight:800;color:var(--gold2);text-shadow:0 0 10px rgba(240,180,41,.35)}
.clkTime{display:flex;align-items:baseline;direction:ltr;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:1px;
  text-shadow:0 0 14px rgba(240,180,41,.55);animation:clkGlow 1s ease-in-out infinite}
@keyframes clkGlow{0%,100%{text-shadow:0 0 8px rgba(240,180,41,.4)}50%{text-shadow:0 0 18px rgba(240,180,41,.75)}}
.clkTime .clkCol{color:var(--gold);margin:0 1.5px;animation:clkBlink 1s steps(1,end) infinite}
@keyframes clkBlink{0%,49%{opacity:1}50%,100%{opacity:.2}}
@media(max-width:1240px){.clockBox{display:none}}

/* ===== نوار صفحه‌بندی (همهٔ جدول‌ها) ===== */
.pagerBar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:10px 6px 3px;justify-content:center;
  border-top:1px dashed var(--bd);margin-top:4px}
.pgInfo{font-size:12px;color:var(--mut);margin-left:8px}
.pgBtn,.pgNum{background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:9px;min-width:31px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;transition:all .15s;padding:0 8px;font-family:inherit}
.pgBtn{padding:0;width:31px}
.pgBtn svg{display:block}
.pgBtn:hover,.pgNum:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px);background:rgba(240,180,41,.1)}
.pgNum.on{background:linear-gradient(135deg,var(--gold),#d99a12);color:#1a1405;font-weight:800;border-color:transparent;
  box-shadow:0 3px 10px rgba(240,180,41,.35);transform:none}
.pgBtn.dis{opacity:.32;pointer-events:none}
select.pgSize{width:auto!important;flex:0 0 auto;padding:6px 10px!important;font-size:12px!important;border-radius:9px!important;height:30px}

/* ===== ماشین‌حساب گرافیکی شیشه‌ای ===== */
.calcPanel{position:fixed;bottom:16px;right:16px;width:282px;z-index:130;background:rgba(15,19,40,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd2);border-radius:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(240,180,41,.12) inset;padding:12px;
  transform-origin:bottom right;transform:scale(.4) translateY(36px);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.2,1.35,.35,1),opacity .2s}
.calcPanel.on{transform:none;opacity:1;pointer-events:auto}
.calcHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.calcHead .ct{font-weight:800;font-size:13.5px;color:var(--gold2)}
.calcScr{background:linear-gradient(160deg,rgba(240,180,41,.14),rgba(139,92,246,.13));border:1px solid var(--bd2);
  border-radius:14px;padding:9px 14px 11px;margin-bottom:10px;position:relative;overflow:hidden;text-align:left;direction:ltr}
.calcScr:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);
  transform:translateX(-130%);animation:calcShine 3.6s ease infinite}
@keyframes calcShine{0%,55%{transform:translateX(-130%)}90%,100%{transform:translateX(130%)}}
.calcHist{font-size:11.5px;color:var(--mut);min-height:15px;direction:rtl;text-align:left}
.calcDisp{font-size:26px;font-weight:800;color:#fff;letter-spacing:.5px;min-height:34px;line-height:1.3;direction:ltr;text-align:left}
.calcDisp.pop{animation:calcPop .32s}
@keyframes calcPop{0%{transform:scale(1)}45%{transform:scale(1.13);color:var(--gold2)}100%{transform:scale(1)}}
.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cbtn{border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx);border-radius:11px;font-size:15px;
  padding:9px 0;cursor:pointer;font-family:inherit;transition:all .14s;position:relative;overflow:hidden}
.cbtn:hover{background:rgba(240,180,41,.16);border-color:rgba(240,180,41,.5);transform:translateY(-1.5px)}
.cbtn:active{transform:scale(.92)}
.cbtn.op{color:var(--gold2);font-weight:800;background:rgba(240,180,41,.10)}
.cbtn.eq{background:linear-gradient(135deg,var(--gold),#d99a12);color:#1a1405;font-weight:900;border-color:transparent}
.cbtn.eq:hover{filter:brightness(1.1)}
.cbtn.danger{color:var(--rose)}
.cbtn.ghost{color:var(--teal)}
.cbtn.rip:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.4),transparent 70%);animation:calcRip .45s ease-out}
@keyframes calcRip{from{opacity:.9;transform:scale(.25)}to{opacity:0;transform:scale(1.7)}}
#calcBtn.act{color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(240,180,41,.3)}

/* ===== حالت روز برای اجزای v6 ===== */
:where(html.day) .clockBox{background:linear-gradient(135deg,#fff6dd,#e8fbf6);border-color:#e2c26a;
  box-shadow:0 4px 14px rgba(122,88,0,.14)}
:where(html.day) .clkDate{color:#8a6100;text-shadow:none}
:where(html.day) .clkTime{color:#2b2310;text-shadow:none}
:where(html.day) .clkTime .clkCol{color:#b8860b}
:where(html.day) .calcPanel{background:rgba(255,255,255,.97);box-shadow:0 24px 60px rgba(60,60,90,.3)}
:where(html.day) .calcDisp{color:#1c2340}
:where(html.day) .calcHist{color:#6b7499}
:where(html.day) .cbtn{background:#f2f4fa;border-color:#dfe4f2;color:#2c3352}
:where(html.day) .cbtn:hover{background:#fff3d6;border-color:#e2c26a}
:where(html.day) .cbtn.op{color:#8a6100;background:#fff6dd}
:where(html.day) .cbtn.ghost{color:#0c7d6e}
:where(html.day) .calcScr{background:linear-gradient(160deg,#fff6dd,#f0ecff);border-color:#e2c26a}

/* ===== v6.0 — نوار پیشرفت ورود اطلاعات از فایل ===== */
.pgTrack{height:13px;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.pgFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:10px;transition:width .18s ease;
  box-shadow:0 0 12px rgba(240,180,41,.4)}
:where(html.day) .pgTrack{background:#eef1f7;border-color:#dfe4f2}
/* جا برای ساعت وسط نوار بالا — آمارهای نوار بالا وارد مرکز نمی‌شوند */
@media(min-width:1241px){#topStats{margin-inline:238px}}

/* ===== v6.4 — مرتب‌سازی لیست‌ها ===== */
.sortBox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.sortBox .sbtn{background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--mut);border-radius:18px;padding:4.5px 13px;font-size:12px;cursor:pointer;font-family:inherit}
.sortBox .sbtn:hover{border-color:var(--gold);color:var(--tx)}
.sortBox .sbtn.on{background:rgba(240,180,41,.16);border-color:var(--gold);color:var(--gold2);font-weight:700}
:where(html.day) .sortBox .sbtn{background:#fff;border-color:#dfe4f2;color:#5a6580}
:where(html.day) .sortBox .sbtn.on{background:#fff3d6;border-color:#e2c26a;color:#8a6100}
/* دکمهٔ «انتخاب همهٔ نتایج» داخل کمبوباکس تیک‌دار */
.slist .scount{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slist .scount>span:first-child{flex:1;min-width:120px}
.slist .cco{background:rgba(240,180,41,.14);border:1px solid rgba(240,180,41,.45);color:var(--gold2);
  border-radius:14px;padding:2.5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.slist .cco:hover{background:rgba(240,180,41,.26)}
:where(html.day) .slist .cco{background:#fff3d6;color:#8a6100;border-color:#e2c26a}

/* ===== v6.4 — گروه‌های منوی کنار برنامه (کشوی «عملکردها») ===== */
.navGroup{margin:1px 0}
/* ===== v6.6 (درخواست ۴) — کادر جستجوی منوها در ستون کنار برنامه ===== */
.navSearch{padding:10px 10px 2px}
.navSearch .inp{width:100%;font-size:12.5px;padding:8px 11px;border-radius:11px}
:where(html.day) .navSearch .inp{background:#fff}
#navSearch::-webkit-search-cancel-button{-webkit-appearance:none}
.navGrpHead{display:flex;align-items:center;gap:10px;padding:9.5px 11px;border-radius:11px;cursor:pointer;color:#c6cdea;
  border:1px solid transparent;position:relative;font-size:13.5px}
.navGrpHead .ni{font-size:16px;width:22px;text-align:center}
.navGrpHead:hover{background:rgba(255,255,255,.06);color:#fff}
.navGrpHead .chev{margin-inline-start:auto;font-size:9.5px;color:var(--mut);transition:transform .22s}
.navGroup.open .navGrpHead .chev{transform:rotate(-90deg)}
.navGroup .navItem{display:none}
.navGroup.open .navItem{display:flex;padding-inline-start:30px;font-size:12.8px}
.navGroup.open .navItem .ni{font-size:14px}
.navGroup::after{content:'';display:block;margin:2px 11px 2px auto;width:52%;height:1px;background:var(--bd)}
:where(html.day) .navGrpHead{color:#39435e}
:where(html.day) .navGrpHead:hover{background:rgba(30,41,72,.06);color:#101a33}
:where(html.day) .navGroup::after{background:#e8ecf4}

/* ===== v6.4 — هشدارها: کارت انیمیشنی داشبورد + پاپ‌آپ پایین صفحه ===== */
@keyframes warnPulseR{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.30)}50%{box-shadow:0 0 0 10px rgba(251,113,133,0)}}
@keyframes warnPulseG{0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.34)}50%{box-shadow:0 0 0 10px rgba(240,180,41,0)}}
.warnCard{border:1.5px solid rgba(251,113,133,.62);background:rgba(251,113,133,.07);border-radius:14px;
  padding:12px 15px;margin-bottom:10px;animation:warnPulseR 1.7s ease-in-out infinite}
.warnCard.gold{border-color:rgba(240,180,41,.66);background:rgba(240,180,41,.07);animation-name:warnPulseG}
.warnCard .wRow{display:flex;align-items:center;gap:10px;padding:7px 2px;cursor:pointer;font-size:13px;
  border-top:1px dashed rgba(255,255,255,.09)}
.warnCard .wRow:hover{background:rgba(255,255,255,.04)}
.warnCard .wRow b{font-size:13px}
.daysBadge{background:rgba(251,113,133,.16);color:var(--rose);border:1px solid rgba(251,113,133,.4);
  border-radius:12px;padding:3px 11px;font-size:11.5px;font-weight:800;white-space:nowrap}
.daysBadge.today{background:var(--rose);color:#2a0007;border-color:var(--rose);animation:badgeBlink 1.1s ease-in-out infinite}
@keyframes badgeBlink{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.alertPop{position:fixed;bottom:16px;left:16px;z-index:84;width:min(460px,93vw);background:#161c36;
  border:1.5px solid var(--rose);border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.55);
  padding:13px 15px;transform:translateY(140%) scale(.96);opacity:0;transition:.5s cubic-bezier(.2,.9,.3,1.15)}
.alertPop.on{transform:none;opacity:1}
.alertPop .apHead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.alertPop .apHead .apIc{font-size:24px;animation:badgeBlink 1.2s ease-in-out infinite}
.alertPop .apSec{font-weight:800;font-size:12.5px;color:var(--rose);margin:7px 0 2px}
.alertPop .apSec.gold{color:var(--gold2)}
.alertPop .apRow{display:flex;align-items:center;gap:9px;padding:7px 2px;border-top:1px dashed var(--bd);cursor:pointer;font-size:12.5px}
.alertPop .apRow:hover{background:rgba(255,255,255,.045)}
.alertPop .apRow b{display:block;font-size:12.8px}
.alertPop .apAck{cursor:pointer;color:var(--teal);font-weight:800;font-size:13px;padding:4px 6px;border-radius:8px}
.alertPop .apAck:hover{background:rgba(45,212,191,.15)}
.alertPop .apFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;border-top:1px solid var(--bd);padding-top:9px}
:where(html.day) .alertPop{background:#fff;border-color:#e11d48}
:where(html.day) .alertPop .apRow:hover{background:#f6f8fc}
:where(html.day) .warnCard .wRow{border-top-color:#e8ecf4}
/* هایلایت ردیف مقصد پرش از جستجوی پیشرفته */
@keyframes rowFlashK{0%,55%{background:rgba(240,180,41,.38)}100%{background:transparent}}
tr.rowFlash>td{animation:rowFlashK 2.4s ease 1}
/* نشان وضعیت تایید شده */
.bg-teal{background:rgba(45,212,191,.15);color:var(--teal)}
:where(html.day) .bg-teal{color:#0c7d6e}

/* ===== v6.4 (درخواست ۱۶) — نوار راهنمای کلیدهای میانبر F1..F10 =====
   زیر صفحهٔ فعال، همیشه دیده می‌شود؛ کلیک روی هر چیپ هم همان کار را انجام می‌دهد */
#hotkeyBar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;align-items:center;gap:7px;
  padding:7px 16px;background:var(--bg2);border-top:1px solid var(--bd);
  box-shadow:0 -8px 22px rgba(0,0,0,.14);flex-wrap:wrap;max-height:96px;overflow:auto}
#hotkeyBar.on{display:flex}
#hotkeyBar .hkTitle{font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap}
.hkChip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--bd);
  border-radius:9px;padding:3.5px 10px;font-size:11.8px;cursor:pointer;user-select:none}
.hkChip:hover{border-color:var(--gold);background:rgba(240,180,41,.10)}
.hkChip kbd{font-family:inherit;background:var(--gold);color:#231a00;font-weight:800;border-radius:6px;
  padding:1.5px 8px;font-size:11px;box-shadow:0 2px 0 rgba(0,0,0,.28)}
:where(html.day) .hkChip kbd{background:#8a6100;color:#fff}
/* جا برای نوار میانبر — محتوا و اعلان‌ها زیر نوار پنهان نشوند */
body:has(#hotkeyBar.on) #pageWrap{padding-bottom:64px}
body:has(#hotkeyBar.on) #toastRoot{bottom:70px}
body:has(#hotkeyBar.on) .alertPop{bottom:72px}

/* ===== v6.8.0 — ضربدر پاک‌کردن متن + تماس با طراح + بازی فیبوناچی «سرگرمی” ===== */
/* ضربدرِ پاک‌کردن سریع متن داخل کادرهای «جستجو و جایگزینی» */
.clrWrap{position:relative;display:inline-flex;align-items:center;max-width:100%}
.clrWrap .inp{padding-inline-end:36px}
.clrX{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);
  width:23px;height:23px;border-radius:50%;border:none;cursor:pointer;line-height:1;padding:0;
  background:rgba(148,163,184,.28);color:var(--tx);font-size:11.5px;display:flex;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.16s}
.clrX.on{opacity:.9;pointer-events:auto}
.clrX:hover{background:var(--rose);color:#fff;opacity:1}
:where(html.day) .clrX{background:rgba(30,41,72,.15)}

/* کارت‌های «تماس با طراح و برنامه‌نویس» و «سرگرمی» در داشبورد */
.dashFunHead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;margin-bottom:8px}
.dashFunHead .dfi{font-size:22px;line-height:1}
/* پنجرهٔ تماس با طراح و برنامه‌نویس */
.contactBox{text-align:center;padding:6px 2px}
.contactAva{font-size:44px;line-height:1}
.contactRole{font-weight:900;font-size:17px;color:var(--gold2);margin-top:7px}
:where(html.day) .contactRole{color:#8a6100}
.contactSub{color:var(--mut);font-size:12.5px;margin-top:3px}
.telBig{font-size:27px;font-weight:900;letter-spacing:1.5px;color:var(--gold2);
  background:var(--card2);border:1.5px dashed var(--gold);border-radius:13px;
  padding:10px 18px;margin-top:11px;display:inline-block}
:where(html.day) .telBig{color:#8a6100;background:#fdf6e3}

/* بازی فیبوناچی «سرگرمی» */
.fibHud{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:10px}
.fibChip{background:var(--card2);border:1px solid var(--bd);border-radius:12px;
  padding:5px 12px;text-align:center;flex:1;min-width:88px}
.fibChip .fl{display:block;font-size:10.5px;font-weight:700;color:var(--mut)}
.fibChip b{display:block;font-size:16.5px;color:var(--gold2);margin-top:1px}
:where(html.day) .fibChip b{color:#8a6100}
.fibBoard{position:relative;background:var(--card2);border:1px solid var(--bd);border-radius:16px;
  padding:10px;touch-action:none;user-select:none;-webkit-user-select:none;direction:ltr;
  max-width:432px;margin:0 auto}
.fibCells{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fibCell{aspect-ratio:1/1;background:rgba(148,163,184,.13);border-radius:10px}
:where(html.day) .fibBoard{background:#f2f5fb;border-color:#dfe5f0}
:where(html.day) .fibCell{background:#e4e9f3}
.fibTile{position:absolute;top:0;left:0;z-index:2;transition:transform .13s ease-in;will-change:transform}
.fibIn{width:100%;height:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;box-shadow:0 3px 9px rgba(0,0,0,.24);background:#475569;color:#fff}
.fibIn.fibNew{animation:fibNewK .19s ease-out}
.fibIn.fibMerge{animation:fibMergeK .22s ease-out}
@keyframes fibNewK{0%{transform:scale(.25);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fibMergeK{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
.fibIn.fv1{background:#efe6d8;color:#5b4a2f}
.fibIn.fv2{background:#f3dfae;color:#6b4d05}
.fibIn.fv3{background:#f0c96c;color:#533a00}
.fibIn.fv5{background:#eeb23f;color:#3c2a00}
.fibIn.fv8{background:#e2842b;color:#fff8ec}
.fibIn.fv13{background:#d96a2f;color:#fff}
.fibIn.fv21{background:#cf4d54;color:#fff}
.fibIn.fv34{background:#b03a68;color:#fff}
.fibIn.fv55{background:#8b5cf6;color:#fff}
.fibIn.fv89{background:#6366f1;color:#fff}
.fibIn.fv144{background:#3b82f6;color:#fff}
.fibIn.fv233{background:#0ea5e9;color:#fff}
.fibIn.fv377{background:#14b8a6;color:#fff}
.fibIn.fv610{background:#22c55e;color:#fff}
.fibIn.fv987{background:#4d7c0f;color:#fff}
.fibIn.fv1597{background:linear-gradient(135deg,#f0b429,#ffd479);color:#241a00}
.fibIn.fibGold{box-shadow:0 0 18px rgba(240,180,41,.75)}
.fibIn.fv2584{background:linear-gradient(135deg,#7c2d92,#c026d3);color:#fff}
.fibIn.fv4181{background:linear-gradient(135deg,#0f766e,#0ea5e9);color:#fff}
.fibIn.fv6765{background:linear-gradient(135deg,#1e293b,#475569);color:#ffd479}
.fibPad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,40px);
  gap:6px;justify-content:center;direction:ltr;margin-top:12px}
.fibPad .btn{margin:0}
.fibHelp{margin-top:11px;font-size:12.3px;line-height:2;color:var(--mut);text-align:center}
.fibHelp b{color:var(--tx)}
.fibOver{position:absolute;inset:0;z-index:6;border-radius:16px;background:rgba(9,12,24,.78);
  backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;padding:14px}
.fibOver.hide{display:none}
:where(html.day) .fibOver{background:rgba(238,241,247,.92)}
.fibOvIc{font-size:42px}
.fibOvTtl{font-weight:900;font-size:15.5px;color:#fff}
:where(html.day) .fibOvTtl{color:#101a33}
.fibOvScore{font-size:13px;color:var(--gold2);font-weight:800}
:where(html.day) .fibOvScore{color:#8a6100}

/* ═════════ v6.8.2 — جستجوی عمیق منو + آیتم‌های سرگرمی/تماس + نشان نسخه ═════════ */
.navSearch{position:relative}
.navRes{position:absolute;top:calc(100% + 4px);right:6px;left:6px;z-index:95;
  background:var(--card,#141931);border:1px solid var(--bd2);border-radius:13px;
  box-shadow:0 14px 34px rgba(0,0,0,.45);max-height:340px;overflow:auto;padding:6px}
:where(html.day) .navRes{background:#fff;border-color:#dbe2ee;box-shadow:0 14px 30px rgba(30,41,72,.18)}
.navResHead{font-size:11.5px;padding:5px 8px 7px;font-weight:800}
.navResItem{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;cursor:pointer;
  font-size:12.3px;line-height:1.5}
.navResItem:hover{background:rgba(148,163,184,.14)}
:where(html.day) .navResItem:hover{background:#eef2f9}
.navResKind{flex:none;background:rgba(240,180,41,.16);color:var(--gold2);border-radius:7px;
  padding:2px 7px;font-size:10px;font-weight:800;min-width:38px;text-align:center}
:where(html.day) .navResKind{background:#fdf1d1;color:#8a6100}
.navResTxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navResPg{flex:none;color:var(--mut);font-size:10.5px}
.navResMore{padding:6px 9px 3px}
@keyframes fldFlashK{0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,0);background:transparent}
  40%{box-shadow:0 0 0 3px rgba(240,180,41,.65);background:rgba(240,180,41,.14)}}
.fldFlash{animation:fldFlashK 1.2s ease-in-out 2;border-radius:10px}
.verBadge{text-align:center;font-size:10.5px;color:var(--mut);opacity:.8;
  padding:7px 0 9px;border-top:1px dashed var(--bd);margin:6px 8px 0}
.loginVer{text-align:center;color:var(--mut);font-size:11px;margin-top:12px;opacity:.85}
/* بازی داخل صفحهٔ مستقل «سرگرمی» — وسط‌چین با عرض مناسب */
.fibWrap{max-width:470px;margin:0 auto}
.pageFibBox{padding:14px}
/* ═════════ v6.8.3 — انتقال منو به پیشخوان مدیریت ═════════
   کاشی‌های میان‌بر در «نمای کلی» پیشخوان مدیریت */
.pinGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pinTile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px 10px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center;user-select:none}
.pinTile:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.28)}
:where(html.day) .pinTile:hover{box-shadow:0 8px 20px rgba(15,23,42,.12)}
.pinTile .pi{font-size:26px;line-height:1}
.pinTile .pt{font-size:12.5px;font-weight:700;color:var(--tx);line-height:1.5}
.pinTile:active{transform:translateY(0) scale(.98)}

/* ================= Ava Gallery — core ================= */
/* ---------- tiny helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function h(tag,attrs){var e=document.createElement(tag);if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
  if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k==='html')e.innerHTML=v;
  else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='dataset')Object.assign(e.dataset,v);
  else e.setAttribute(k,v)}
  for(var i=2;i<arguments.length;i++){appendKids(e,arguments[i])}return e}

/* ---------- Jalali calendar core (Khayyam algorithm) ---------- */
function _div(a,b){return ~~(a/b)}
function _mod(a,b){return a-~~(a/b)*b}
function jalCal(jy){var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],
  bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
  if(jy<jp||jy>=breaks[bl-1])jy=Math.min(Math.max(jy,jp),breaks[bl-1]-1);
  for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+_div(jump,33)*8+_div(_mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ=leapJ+_div(n,33)*8+_div(_mod(n,33)+3,4);
  if(_mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=_div(gy,4)-_div((_div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+_div(jump+4,33)*33;leap=_mod(_mod(n,33)+4,33);if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march}}
function g2d(gy,gm,gd){var d=_div((gy+_div(gm-8,6)+100100)*1461,4)+_div(153*_mod(gm+9,12)+2,5)+gd-34840408;
  d=d-_div(_div(gy+100100+_div(gm-8,6),100)*3,4)+752;return d}
function d2g(jdn){var j,i,gd,gm,gy;j=4*jdn+139361631;j=j+_div(_div(4*jdn+183187720,146097)*3,4)*4-3908;
  i=_div(_mod(j,1461),4)*5+308;gd=_div(_mod(i,153),5)+1;gm=_mod(_div(i,153),12)+1;
  gy=_div(j,1461)-100100+_div(8-gm,6);return{gy:gy,gm:gm,gd:gd}}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-_div(jm,7)*(jm-7)+jd-1}

  k=jdn-jdn1f;

  if(k<=185){jm=1+_div(k,31);jd=_mod(k,31)+1;return mkJ(jy,jm,jd)}

function tabDraftKey(id){return 'avaDraft_'+id}
/* v3.1: امضای مقادیر همهٔ فیلدهای یک پنجره — برای تشخیص «تغییر نکرده» هنگام بستن */
function inpSig(root){return JSON.stringify(Array.prototype.map.call(
  root.querySelectorAll('input,select,textarea'),function(el){
    if(el.closest&&el.closest('.sbox'))return null;
    if(el.classList&&el.classList.contains('noSig'))return null;
    var t=(el.type||'').toLowerCase();
    if(t==='file'||t==='checkbox'||t==='radio'||t==='password'||t==='button'||t==='submit')return null;
    return{v:el.value==null?'':el.value,j:(el.dataset&&el.dataset.j)||''}}).filter(function(x){return x!==null}))}
function pageInputs(pane){return Array.prototype.slice.call(pane.querySelectorAll('input,select,textarea')).filter(function(el){
  if(el.closest&&el.closest('.sbox'))return false;
  if(el.classList&&el.classList.contains('noSig'))return false;
  var t=(el.type||'').toLowerCase();
  if(t==='file'||t==='checkbox'||t==='radio'||t==='password'||t==='button'||t==='submit')return false;
  return true})}
function snapshotDrafts(id,pane){try{var vals=pageInputs(pane).map(function(el){
    return{v:el.value==null?'':el.value,j:(el.dataset&&el.dataset.j)||''}});
  localStorage.setItem(tabDraftKey(id),JSON.stringify({at:Date.now(),vals:vals}))}catch(e){}}
function clearDraft(id){try{localStorage.removeItem(tabDraftKey(id))}catch(e){}}
function restoreDrafts(id,pane){var raw=null;try{raw=localStorage.getItem(tabDraftKey(id))}catch(e){}
  if(!raw)return;
  try{localStorage.removeItem(tabDraftKey(id));var d=JSON.parse(raw);
    var els=pageInputs(pane);if(!d||!d.vals||d.vals.length!==els.length)return;
    var n=0;
    els.forEach(function(el,i){var rec=d.vals[i];if(!rec)return;
      if(rec.j&&el.setAttribute){try{el.dataset.j=rec.j}catch(e){}el.value=rec.v||'';n++}
      else if(el.tagName==='SELECT'){for(var k=0;k<el.options.length;k++)
        if(String(el.options[k].value)===String(rec.v)){el.value=rec.v;n++;break}}
      else if(rec.v!==''&&rec.v!=null){el.value=rec.v;n++}});
    if(n)setTimeout(function(){toast('📋 اطلاعات ناقص ذخیره‌شدهٔ قبلی همین پنجره بازیابی شد','info')},250)}

function openTabPane(id,mod){
  var bar=$('#tabBar'),page=$('#page');

  /* v6.4: پرش از «جستجوی پیشرفته» — اگر پنجرهٔ مقصد از قبل باز است، دوباره از نو
     رندر می‌شود تا تب مقصد (مثلاً «نقاشان» در اطلاعات پایه) انتخاب و ردیفِ
     موردنظر با انیمیشن مشخص شود */
  var jump=window._advJump;

     نیمه‌کاری ندارد، با هر ورود به آن از نو ساخته می‌شود تا همه‌چیز همیشه تازه باشد
     v6.7.1 (رفع اشکال «تب داشبورد مدیریتی در نوار تب‌ها جابجا می‌شود»): فقط «محتوا»
     (pane) از نو ساخته می‌شود؛ خودِ تب دست نمی‌خورد تا جای آن در نوار تب‌ها ثابت
     بماند و همیشه اولِ همهٔ تب‌ها باشد (قبلاً تب حذف و به آخرِ نوار اضافه می‌شد) */
  if(id==='dashboard'&&pane){try{if(pane)pane.remove();pane=null}catch(e){}}
  /* v3.2: اگر پیام «همهٔ پنجره‌ها بسته شد» روی صفحه مانده، با بازشدن اولین پنجرهٔ جدید حذف شود */
  var noTabMsg=page.querySelector('.noTabsMsg');if(noTabMsg)noTabMsg.remove();
  if(!pane){pane=h('div',{class:'pagePane',dataset:{pg:id}});page.appendChild(pane);
    if(PAGES[id])PAGES[id].render(pane);

  /* v6.7.1: تب و محتوا دیگر همیشه با هم ساخته نمی‌شوند — اگر تبِ همین پنجره از
     قبل در نوار هست (مثلاً داشبورد که محتوایش با هر ورود تازه می‌شود)، همان تب
     دست‌نخورده نگه داشته می‌شود تا جای آن در نوار عوض نشود */
  if(tab&&!tab.parentNode)tab=null;
  if(!tab){
    tab=h('div',{class:'pgTab',dataset:{pg:id},onclick:function(){navTo(id)},title:mod.t},
      h('span',{class:'ti'},mod.ic||'📄'),h('span',{class:'tt'},mod.t),
      /* v6.0: داشبورد مدیریتی همیشه باز است — ضربدر بستن ندارد */
      (id!=='dashboard')?h('span',{class:'tx',title:'بستن این پنجره',onclick:function(ev){ev.stopPropagation();closeTab(id)}},'✕'):null);

       جای آن را عوض کند؛ بقیهٔ تب‌ها مثل قبل به انتهای نوار اضافه می‌شوند */

  if(id==='dashboard'&&bar.firstChild!==tab){try{bar.insertBefore(tab,bar.firstChild)}catch(e){}}

  $$('#tabBar .pgTab').forEach(function(t){t.classList.toggle('on',t===tab)});
  /* v6.4 (درخواست ۱۶): کلیدهای میانبرِ صفحهٔ فعال دوباره برقرار می‌شوند — کلیدهای
     صفحهٔ قبلی باقی نمی‌مانند تا F1 و F2 همیشه مال همان صفحه‌ای باشند که کاربر می‌بیند */
  try{applyPaneHotkeys(pane)}catch(e){}

  setTimeout(function(){try{redrawCharts(pane)}catch(e){}},30);
  /* v6.4: پس از رندر مقصدِ پرش، ردیفِ پیدا‌شده با انیمیشن مشخص می‌شود */
  setTimeout(function(){try{var j=window._advJump;

function closeTab(id){

  if(id==='dashboard'){toast('داشبورد مدیریتی همیشه باز است و بسته نمی‌شود 🔒','info');return}

  var tab=bar.querySelector('.pgTab[data-pg="'+id+'"]');
  var pane=$('#page .pagePane[data-pg="'+id+'"]');
  function teardown(saved){
    /* v6.0: با «ذخیره و بستن»، فرم‌هایی که ذخیرهٔ مستقیم دارند (مثل تنظیمات)
       هم واقعاً ذخیره می‌شوند — قبلاً فقط پیش‌نویس نگه داشته می‌شد */
    if(saved==='save'){try{if(pane&&pane._onSaveAll)pane._onSaveAll()}catch(e){}
      if(pane)snapshotDrafts(id,pane)}
    else clearDraft(id);
    if(tab)tab.remove();if(pane)pane.remove();
    var rest=$$('#tabBar .pgTab');
    if(!rest.length){$('#pgTitle').textContent='';
      $('#page').innerHTML='';$('#page').appendChild(
        h('div',{class:'empty noTabsMsg',style:'padding-top:90px'},h('span',{class:'ei'},'🗂️'),
          h('div',{},'همهٔ پنجره‌ها بسته شد — از منوی کنار یک قسمت را باز کنید')));
      try{applyPaneHotkeys(null)}catch(e){}}
    else navTo(rest[rest.length-1].getAttribute('data-pg'));
    if(saved==='save')toast('اطلاعات پنجره ذخیره و پنجره بسته شد ✅')
    else if(saved==='discard')toast('پنجره بدون ذخیره بسته شد','info')}
  /* v3.1: اگر هیچ مقداری در پنجره عوض نشده باشد، بدون سؤال و یک‌راست بسته می‌شود */
  var changed=true;
  try{if(pane&&pane._sig0!=null)changed=(inpSig(pane)!==pane._sig0)}catch(e){}
  if(!changed){teardown(null);return}
  confirmBox3('پنجرهٔ «'+(mod?mod.t:id)+'» بسته شود؟ آیا می‌خواهید اطلاعات ذخیره شود؟ '+
    'با «ذخیره و بستن»، فرم‌های نیمه‌کارهٔ همین پنجره نگه داشته می‌شوند و دفعهٔ بعد دوباره بازیابی می‌شوند.',
    '💾 ذخیره و بستن','بدون ذخیره ببند').then(function(r){
    if(r==null)return;
    teardown(r)})}

   تکراری پر می‌شود (تلفن، عکس، کد، تخصص و…) و همهٔ ارجاع‌ها به id رکورد اصلی بازنویسی
   می‌شوند. تعداد رکوردهای ادغام‌شده را برمی‌گرداند */
function dedupeList(key){var arr=DB[key];if(!Array.isArray(arr))return 0;
  var map={},keep=[],dupes=[];
  arr.forEach(function(x){var k=x&&x.name?nameKey(x.name):'';
    if(!k){keep.push(x);return}
    if(!map[k]){map[k]=x;keep.push(x)}
    else{var tgt=map[k];
      Object.keys(x).forEach(function(f){if(f==='id')return;
        var tv=tgt[f],xv=x[f];
        if(tv==null||tv==='')tgt[f]=xv});
      dupes.push(x)}});
  if(!dupes.length)return 0;
  var idmap={};dupes.forEach(function(x){var t=map[nameKey(x.name)];if(t)idmap[x.id]=t.id});
  (DEDUPE_MAP[key]||[]).forEach(function(pr){var a2=DB[pr[0]];if(!Array.isArray(a2))return;
    a2.forEach(function(r){var nv=idmap[r[pr[1]]];if(nv&&nv!==r[pr[1]])r[pr[1]]=nv})});
  DB[key]=keep;
  return dupes.length}

var TARIFF_TYPES=[{value:'mold',label:'🧱 قالب'},{value:'sculpt',label:'🗿 مجسمه'},{value:'product',label:'🏺 محصول'}];

function tariffArr(t){return t.itemType==='mold'?DB.molds:(t.itemType==='product'?DB.products:DB.sculptures)}
PAGES.tariff={render:function(pg){
  pg.appendChild(pageHead('تعرفه‌های مصوب','قیمت‌هایی که مدیر تأیید کرده است (قالب، مجسمه و محصول) — عملکرد و انبار فقط از همین نرخ‌ها قیمت می‌خوانند'));
  function refName(t){var arr=tariffArr(t);var x=arr.find(function(a){return a.id===t.refId});return x?x.name:'(حذف شده)'}
  function cols(){return[
    {t:'نوع',g:function(r){return r.itemType==='mold'?h('span',{class:'badge bg-gold'},'🧱 قالب'):
      (r.itemType==='product'?h('span',{class:'badge bg-blue'},'🏺 محصول'):h('span',{class:'badge bg-violet'},'🗿 مجسمه'))}},
    {t:'عنوان',g:function(r){return h('b',{},refName(r))}},
    {t:'نرخ مصوب',g:function(r){return h('b',{class:'goldTx'},fmtM(r.price))}},
    {t:'تاریخ تأیید',g:function(r){return jStr(r.date)}}]}
  var box=h('div',{});

    var add=h('button',{class:'btn gold',onclick:function(){openT(null)}},'+ افزودن تعرفه مصوب');
    box.appendChild(h('div',{class:'spread',style:'margin-bottom:10px'},h('div',{class:'mut small'},
      'تعداد کل: '+fmtN(DB.tariff.length)+' مورد'),add));
    box.appendChild(table(cols(),DB.tariff.slice().sort(function(a,b){return jCmp(b.date,a.date)}),{pager:'tariffList',actions:function(r){
      return h('div',{},h('button',{class:'btn ghost sm',onclick:function(){openT(r)}},'✏️'),
        h('button',{class:'btn ghost sm',onclick:function(){confirmBox('این تعرفه حذف شود؟',{danger:true}).then(function(ok){if(!ok)return;
          DB.tariff=DB.tariff.filter(function(x){return x.id!==r.id});saveDB();draw();drawBulk();toast('حذف شد')})}},'🗑️'))},emoji:'💵'}))}
  var bulkBox=h('div',{class:'mb8'});
  /* ---------- v3.1: اختصاص گروهی تعرفه — جستجوی محصول/قالب/مجسمه و تیک‌زدن چند مورد ----------
     v3.2: جمعِ نرخ‌های مصوب موارد تیک‌خورده هم زنده نمایش داده می‌شود */
  function drawBulk(){bulkBox.innerHTML='';
    var fType=selEl(TARIFF_TYPES,'product');
    var fPrice=moneyInp({ph:'نرخ مصوب برای همهٔ موارد تیک‌خورده (تومان)'}),fDate=jDateInp(todayJ());
    var sumBox=h('div',{class:'goldTx',style:'min-height:22px;margin-top:7px;font-weight:800;font-size:13.5px'},'');
    function updSum(){var got=picker.getChecked();
      if(!got.length){sumBox.textContent='';return}
      var sum=0,have=0;
      got.forEach(function(it){var lt=latestTariff(it.id,fType.value);if(lt){sum+=lt.price;have++}});
      sumBox.textContent='Σ جمع نرخ‌های مصوب '+fmtN(have)+' موردِ تیک‌خورده: '+fmtM(sum)+
        (have<got.length?(' — '+fmtN(got.length-have)+' مورد هنوز تعرفهٔ مصوب ندارند'):'')}
    var picker=checkPicker({ph:'🔍 کلیک کنید تا فهرست باز شود؛ جستجو کنید و موردنظرها را تیک بزنید…',
      source:function(){var arr=tariffArr({itemType:fType.value})||[];
        return arr.map(function(a){var lt=latestTariff(a.id,fType.value);
          return{id:a.id,label:a.name,sub:lt?('نرخ فعلی: '+fmtM(lt.price)):null}})},
      onToggle:updSum});
    var pickBtn=h('button',{class:'btn gold',style:'margin-top:9px'},'✅ مصوب کردن موارد تیک‌خورده');
    function refreshPh(){picker.clear();picker.refresh();updSum()}
    fType.addEventListener('change',refreshPh);
    pickBtn.addEventListener('click',function(){
      var got=picker.getChecked();
      if(!got.length){toast('حداقل یک مورد را از فهرست تیک بزنید','err');return}
      var price=toNum(fPrice.value);
      if(price<=0){toast('نرخ مصوب را وارد کنید','err');return}
      var tname=tariffTypeLabel({itemType:fType.value});
      confirmBox(fmtN(got.length)+' مورد تیک‌خورده با نرخ '+fmtM(price)+' مصوب می‌شود. ادامه؟',{ok:'تأیید و ثبت'})
        .then(function(ok){if(!ok)return;
          var d=getJVal(fDate)||todayJ();
          got.forEach(function(it){DB.tariff.push({id:uid('trf'),itemType:fType.value,refId:it.id,price:price,date:d})});
          saveDB();picker.clear();fPrice.value='';fPrice._sync();draw();refreshStats();
          toast('تعرفهٔ '+fmtN(got.length)+' '+tname+' مصوب شد ✅')})});
    var card=h('div',{class:'card'},h('div',{class:'b mb8'},'📋 اختصاص گروهی تعرفه (جستجو + تیک‌زدن چند مورد)'),
      h('div',{class:'mut small',style:'margin-bottom:9px;line-height:2'},
        'نوع را انتخاب کنید؛ سپس در کمبوباکسِ پایین با کلیک یا تایپ، فهرست باز می‌شود و محصولات/قالب‌ها/مجسمه‌ها را داخل خودِ کمبوباکس تیک بزنید (چند مورد یکجا) — جمعِ نرخ‌های مصوب موارد تیک‌خورده زنده نشان داده می‌شود؛ سپس یک نرخ مصوب برای همه ثبت کنید یا همین جمع را یادداشت کنید.',
        h('br'),
        'v6.8.8 — اگر برای یک مورد قبلاً نرخ ثبت شده باشد و همان روز نرخ جدید بدهید، حالا «آخرین نرخِ ثبت‌شده» ملاکِ ثبت عملکرد و انبار است (قبلاً نرخ قدیمیِ همان روز ملاک می‌شد).'),
      h('div',{class:'f2'},fld('نوع موارد',fType),fld('نرخ مصوب (تومان) — برای همهٔ تیک‌خورده‌ها',fPrice,null,1)),
      fld('تاریخ تأیید',fDate),
      picker.el,sumBox,pickBtn);
    bulkBox.appendChild(card)}
  function openT(r){var collect=null;
    var fType=selEl(TARIFF_TYPES,r?r.itemType:'mold');
    var fRef=selSearch(function(){return tariffArr({itemType:fType.value}).map(function(a){return{value:a.id,label:a.name}})},r?r.refId:null);
    fType.addEventListener('change',function(){fRef.value='';fRef.refresh()});
    var fPrice=moneyInp({value:r?r.price:''}),fDate=jDateInp(r?r.date:todayJ());
    var body=h('div',{},fld('نوع تعرفه',fType,null,1),fld('عنوان',fRef,'اگر موردی در لیست نیست، ابتدا در «اطلاعات پایه» ثبتش کنید',1),
      fld('نرخ مصوب (تومان)',fPrice,null,1),fld('تاریخ تأیید',fDate));
    var foot=h('div',{},h('button',{class:'btn gold',onclick:save},'💾 ذخیره تأییدیه'));
    var md=modal({title:r?'ویرایش تعرفه':'تأیید تعرفه جدید',body:body,footer:foot,onSave:save});
    function save(){var price=toNum(fPrice.value);var ref=fRef.value;
      if(!ref){toast('عنوان را انتخاب کنید','err');return false}
      if(price<=0){toast('نرخ باید بزرگ‌تر از صفر باشد','err');return false}
      var o={itemType:fType.value,refId:ref,price:price,date:getJVal(fDate)||todayJ()};

function calcW(){var inQ=0,inV=0,outQ=0,byP={},k;
  DB.warehouseIn.forEach(function(e){inQ+=e.qty;inV+=e.total;
    var b=byP[e.productId]||(byP[e.productId]={q:0,v:0});b.q+=e.qty;b.v+=e.total});
  DB.transfers.forEach(function(t){outQ+=t.qty;if(byP[t.productId])byP[t.productId].q-=t.qty});
  var val=0,items=0,curQ=0;
  for(k in byP){(function(pid){var st=byP[pid];if(st.q>0){var tin=0,tv=0;
    DB.warehouseIn.forEach(function(e){if(e.productId===pid){tin+=e.qty;tv+=e.total}});
    val+=st.q*(tin?tv/tin:0);items++;curQ+=st.q}})(k)}
  return{inQ:inQ,inV:inV,outQ:outQ,val:val,items:items,curQ:curQ}}
function stockOf(pid){var i=0;DB.warehouseIn.forEach(function(e){if(e.productId===pid)i+=e.qty});
  DB.transfers.forEach(function(t){if(t.productId===pid)i-=t.qty});return i}
function nameOfById(arr,id){var x=arr.find(function(a){return a.id===id});return x?(x.name||x.bankName||'—'):'—'}
/* آخرین (جدیدترین) تعرفهٔ مصوب یک قلم از «تعرفه‌های مصوب»
   v6.8.8 (رفع باگ «ویرایش گروهی تعرفه درست کار نمی‌کند»): مقایسه با >= — اگر برای
   یک قلم در «یک روز» چند نرخ مصوب شود (مثلاً نرخ اشتباه همان روز با «اختصاص گروهی»
   اصلاح شود)، قبلاً مقایسهٔ سخت‌گیرانهٔ > همیشه «اولین» ثبتِ آن روز را ملاک قرار
   می‌داد و نرخ جدید نادیده گرفته می‌شد؛ حالا آخرینِ ثبت‌شده در برنامه ملاک است. */
function latestTariff(refId,type){var best=null;
  DB.tariff.forEach(function(t){if(t.itemType===type&&t.refId===refId&&(!best||jCmp(t.date,best.date)>=0))best=t});
  return best}

/* ---------- performance modules factory ---------- */
function perfModule(cfg){
  /* v6.4: انتخاب‌گرها فقط نام‌های یکتا را نشان می‌دهند (نمایش بدون تکرار — بدون حذف رکورد) */
  function personOpts(){return uniqByName(DB[cfg.listKey]).map(function(p){return{value:p.id,label:p.name+(p.code?' ('+p.code+')':'')}})}
  function itemOpts(){return uniqByName(DB[cfg.itemKey]).map(function(p){return{value:p.id,label:p.name}})}
  function tariffOpts(itemId){return DB.tariff.filter(function(t){return t.itemType===cfg.tariffType&&t.refId===itemId})
    .sort(function(a,b){return jCmp(b.date,a.date)})
    .map(function(t){return{value:t.id,label:fmtM(t.price)+' — نرخ مصوب',sub:jStr(t.date)}})}
  /* v6.1: سهم یک شخص از رکورد — عملکرد دو نفره طبق نسبت توافقی تقسیم می‌شود
     (یک بار در سطح ماژول تعریف شده تا هم تب ثبت و هم تب گزارش استفاده کنند) */
  function shareOfRec(r,pid){if(!r.partnerId)return pid?(r.personId===pid?1:0):1;
    var ps=(r.partnerShare==null?0.5:r.partnerShare);
    if(pid===r.personId)return 1-ps;
    if(pid===r.partnerId)return ps;
    return pid?0:1}
  /* v6.1 (درخواست کاربر): «نام‌ها بدون تکرار» — خلاصهٔ عملکرد به تفکیک شخص؛
     هر نقاش/قالب‌ریز/مجسمه‌ساز فقط یک بار در لیست می‌آید و جمع تولید و مبلغِ
     همهٔ رکوردهایش (شامل سهمش در کارهای دو نفره) در همان یک ردیف دیده می‌شود */
  function personSum(){var map={},order=[];
    function bucket(pid){if(!map[pid]){map[pid]={pid:pid,recs:[],totQ:0,totV:0,sh:0,last:null};order.push(pid)}return map[pid]}
    DB[cfg.perfKey].forEach(function(r){
      var g1=bucket(r.personId);var s1=shareOfRec(r,r.personId);
      g1.recs.push(r);g1.totQ+=r.qty*s1;g1.totV+=r.total*s1;
      if(r.partnerId)g1.sh++;
      if(!g1.last||jCmp(r.date,g1.last)>0)g1.last=r.date;
      if(r.partnerId&&r.partnerId!==r.personId){
        var g2=bucket(r.partnerId);var s2=shareOfRec(r,r.partnerId);
        g2.recs.push(r);g2.totQ+=r.qty*s2;g2.totV+=r.total*s2;g2.sh++;
        if(!g2.last||jCmp(r.date,g2.last)>0)g2.last=r.date}});
    return order.map(function(pid){return map[pid]})}
  /* ---------- v6.8.5: ویرایش رکورد عملکرد (تک‌موردی) ----------
     تا حالا رکوردهای عملکرد فقط نمایش و حذف داشتند؛ حالا با دکمهٔ ✏️ در هر
     دو پنجرهٔ «📋 رکوردها» و «📋 ریز همهٔ رکوردها» می‌شود رکورد را اصلاح کرد:
     نفر، قلم/محصول، تعداد، نرخ، تاریخ، توضیح و شریک‌کاری — مبلغ «جمع»
     خودکار = تعداد × نرخ بازمحاسبه می‌شود و در خلاصه و گزارش‌ها فوراً می‌آید. */
  function editModal(r,after){
    var fP=selSearch(personOpts,r.personId);
    var fI=selSearch(itemOpts,r.itemId);
    var fQ=inp({type:'number',value:r.qty});
    var fPr=moneyInp({value:r.price});
    var fD=jDateInp(r.date);
    var fN=inp({value:r.note||'',ph:'توضیح (اختیاری)'});
    var fPt=null,shareVal=(r.partnerShare==null?0.5:r.partnerShare),shareRow=null;
    if(cfg.partner){
      fPt=selSearch(function(){return personOpts().filter(function(o){return o.value!==fP.value})},r.partnerId||null,
        {ph:'🔍 شریک (اختیاری) — برای حذف شریک خالی بگذارید'});
      shareRow=h('div',{class:'row gap6 wrap'});
      function drawShare(){shareRow.innerHTML='';
        if(!fPt.value){shareRow.style.display='none';return}
        shareRow.style.display='';
        [[0.5,'۵۰/۵۰'],[0.6,'۶۰/۴۰'],[0.4,'۴۰/۶۰'],[0.7,'۷۰/۳۰'],[0.3,'۳۰/۷۰']].forEach(function(pr){
          shareRow.appendChild(h('span',{class:'badge '+(Math.abs(shareVal-pr[0])<.001?'bg-gold':'bg-gray'),
            style:'cursor:pointer;font-size:12px;padding:5px 11px',onclick:function(){shareVal=pr[0];drawShare()}},pr[1]))})}
      drawShare();fPt.addEventListener('change',drawShare);
      fP.addEventListener('change',function(){if(fPt.value===fP.value){fPt.value='';drawShare();
        toast('شریک با '+cfg.personT+' اصلی یکی بود — پاک شد','info')}})}
    var md=modal({title:'✏️ ویرایش رکورد '+r.code,size:'wide',

        cfg.partner?h('div',{class:'row gap6 wrap'},h('span',{class:'mut small'},'🤝 نسبت تقسیم مبلغ:'),shareRow):null),

    function save(){

      if(cfg.partner&&fPt.value&&fPt.value===fP.value){toast('شریک نمی‌تواند همان '+cfg.personT+' اصلی باشد','err');return}
      r.personId=fP.value;r.itemId=fI.value;r.qty=qty;r.price=price;r.total=qty*price;
      r.date=getJVal(fD)||r.date;r.note=norm(fN.value);
      if(cfg.partner){
        if(fPt.value){r.partnerId=fPt.value;r.partnerShare=shareVal}
        else{delete r.partnerId;delete r.partnerShare}}
      saveDB();md.close();if(after)after();
      toast('رکورد '+r.code+' ویرایش شد ✅')}}
  /* ---------- v6.8.6: ویرایش گروهی عمومی رکوردهای عملکرد ----------
     از هر دو پنجرهٔ «📋 رکوردها» (ریز یک نفر) و «📋 ریز همهٔ رکوردها» صدا زده
     می‌شود؛ فقط فیلدهایی که پر شوند روی رکوردهای تیک‌خورده اعمال می‌شوند
     (فیلد خالی = بدون تغییر) و «جمع» هر رکورد خودکار = تعداد × نرخ می‌شود */
  function bulkEditIds(ids,after){ids=(ids||[]).filter(function(id){
      return DB[cfg.perfKey].some(function(r){return r.id===id})});
    if(!ids.length){toast('اول رکوردهای موردنظر را تیک بزنید','err');return}
    var nP=selSearch(function(){return[{value:'',label:'— تغییری ندهد —'}].concat(personOpts())},null);
    var nI=selSearch(function(){return[{value:'',label:'— تغییری ندهد —'}].concat(itemOpts())},null);
    var nQ=inp({type:'number',ph:'خالی = بدون تغییر'});
    var nPr=moneyInp({ph:'خالی = بدون تغییر'});
    var nD=jDateInp(null);
    var nN=inp({ph:'خالی = بدون تغییر'});
    var md=modal({title:'✏️ ویرایش گروهی '+fmtN(ids.length)+' رکورد عملکرد',size:'wide',
      body:h('div',{},
        h('div',{class:'fhint mb8'},'فقط فیلدهایی که پر کنید روی همهٔ '+fmtN(ids.length)+' رکورد تیک‌خورده اعمال می‌شوند؛ فیلد خالی یعنی بدون تغییر. مبلغ «جمع» هر رکورد خودکار = تعداد × نرخ بازمحاسبه می‌شود.'),
        h('div',{class:'f2'},fld(cfg.personT,nP),fld(cfg.itemT,nI),fld('تعداد',nQ),
          fld('نرخ (تومان)',nPr),fld('تاریخ',nD),fld('توضیحات',nN))),
      footer:h('div',{},h('button',{class:'btn gold',onclick:apply},'⚡ اعمال روی '+fmtN(ids.length)+' رکورد'))});
    function apply(){
      var o={};var any=false;
      if(nP.value){o.personId=nP.value;any=true}

      if(String(nQ.value).trim()!==''&&toNum(nQ.value)>0){o.qty=toNum(nQ.value);any=true}

      confirmBox('فیلدهای انتخابی روی '+fmtN(ids.length)+' رکورد اعمال شود؟',{ok:'اعمال کن'})
        .then(function(ok){if(!ok)return;
          var n=0;DB[cfg.perfKey].forEach(function(r){if(ids.indexOf(r.id)>=0){

            if(o.itemId)r.itemId=o.itemId;
            if(o.qty!=null)r.qty=o.qty;
            if(o.price!=null)r.price=o.price;
            r.total=r.qty*r.price;
            if(o.date)r.date=o.date;
            if(o.note!=null)r.note=o.note;

          saveDB();md.close();if(after)after();

  PAGES[cfg.pageId]={render:function(pg){

      /* پنجرهٔ ریز رکوردهای یک نفر — نام نفر فقط در عنوان پنجره یک بار می‌آید

      function recsModal(g){var p=DB[cfg.listKey].find(function(x){return x.id===g.pid});
        var tbl=h('div',{});var md=null;var sel={};var _vis=[];

            {t:'کد',g:function(r){return r.code}},{t:'تاریخ',g:function(r){return jStr(r.date)}},
            {t:cfg.itemT,g:function(r){return nameOfById(DB[cfg.itemKey],r.itemId)}},
            {t:'تعداد',g:function(r){return fmtN(r.qty)}},{t:'نرخ',g:function(r){return fmtM(r.price)}},
            {t:'جمع',g:function(r){return h('b',{class:'goldTx'},fmtM(r.total))}},
            {t:'سهم این '+cfg.personT,g:function(r){var s=shareOfRec(r,g.pid);
              if(s>=1)return h('span',{class:'mut'},'—');
              if(s<=0)return '۰';
              return h('span',{class:'badge bg-violet',style:'font-size:11.5px'},fmtM(r.total*s)+' ('+toFa(Math.round(s*100))+'٪) 🤝')}},
            {t:'شریک',g:function(r){return r.partnerId?nameOfById(DB[cfg.listKey],r.partnerId):h('span',{class:'mut'},'—')}},
            {t:'توضیح',g:function(r){return r.note||'—'}}],
            _vis,
            {pager:cfg.perfKey+'Recs_'+g.pid,actions:function(r){return h('div',{style:'display:flex;gap:6px;justify-content:flex-end'},
              h('button',{class:'btn ghost sm',title:'ویرایش رکورد',onclick:function(){editModal(r,function(){draw();drawList()})}},'✏️'),
              delBtn('این رکورد حذف شود؟',function(){
                DB[cfg.perfKey]=DB[cfg.perfKey].filter(function(x){return x.id!==r.id});delete sel[r.id];saveDB();drawList();draw()}))},emoji:cfg.emoji}))}
        function bulkEdit(){bulkEditIds(Object.keys(sel),function(){sel={};draw();drawList()})}
        draw();
        md=modal({title:'📋 رکوردهای '+cfg.personT+' — '+esc(p?p.name:''),size:'wide',fullBtn:true,body:h('div',{},
          h('div',{class:'row gap6 wrap',style:'margin:0 2px 9px'},
            fS,pickB,
            h('button',{class:'btn sm',type:'button',onclick:bulkEdit},'✏️ ویرایش گروهی انتخاب‌شده‌ها'),
            h('button',{class:'btn ghost sm',type:'button',onclick:function(){sel={};draw()}},'لغو انتخاب'),
            cntB,shownB),
